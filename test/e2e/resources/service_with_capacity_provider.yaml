apiVersion: ecs.services.k8s.aws/v1alpha1
kind: Service
metadata:
  name: $SERVICE_NAME
spec:
  name: $SERVICE_NAME
  taskDefinition: $TASK_DEFINITION_NAME
  cluster: $CLUSTER_NAME
  desiredCount: 0
  capacityProviderStrategy:
    - capacityProvider: $CAPACITY_PROVIDER_NAME
      weight: 1
      base: 0
  networkConfiguration:
    awsVPCConfiguration:
      assignPublicIP: DISABLED
      subnets:
      - $PRIVATE_SUBNET
